<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student Record</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --danger-color: #dc3545;
            --danger-hover: #c82333;
            --success-color: #28a745;
            --success-hover: #218838;
            --background-color: rgba(128, 187, 210, 0.95);
            --text-color: #2c3e50;
            --input-bg: rgb(207, 241, 255);
            --border-color: #4682B4;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-image: url(https://cdn.pixabay.com/photo/2018/07/05/16/59/students-3518726_1280.jpg);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            color: var(--text-color);
        }
        
        .container {
            background: var(--background-color);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            margin: 2rem auto;
            position: relative;
            text-align: center;
        }
        
        h2 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
        }
        
        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-size: 1rem;
            text-align: left;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--input-bg);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .btn-delete, .btn-cancel {
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: none;
            width: 100%;
            display: block;
        }
        
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
        }
        
        .btn-delete:hover {
            background-color: var(--danger-hover);
        }
        
        .btn-cancel {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
        }
        
        .btn-cancel:hover {
            background-color: var(--secondary-color);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .action-buttons .btn-delete,
        .action-buttons .btn-cancel {
            flex: 1;
        }
        
        /* Popup styles */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .popup-content {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .popup-message {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        
        .popup-close {
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .popup-close:hover {
            background-color: var(--secondary-color);
        }
        
        .success-message {
            color: var(--success-color);
        }
        
        .error-message {
            color: var(--danger-color);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Delete Student Record</h2>
        
        <form id="deleteForm">
            <div class="form-group">
                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" name="id" required
                       placeholder="Enter student ID to delete">
            </div>
            
            <div class="action-buttons">
                <button type="submit" class="btn-delete">Confirm Delete</button>
                <a href="home.html" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

    <!-- Success Popup -->
    <div id="successPopup" class="popup">
        <div class="popup-content">
            <p class="popup-message success-message">Student deleted successfully!</p>
        </div>
    </div>
    
    <!-- Error Popup -->
    <div id="errorPopup" class="popup">
        <div class="popup-content">
            <p id="errorMessage" class="popup-message error-message"></p>
            <button class="popup-close" onclick="closePopup('errorPopup')">OK</button>
        </div>
    </div>

    <script>
        document.getElementById('deleteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const studentId = document.getElementById('studentId').value.trim();
            
            // Client-side validation
          
            
            try {
                const response = await fetch('DeleteServlet', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `id=${studentId}`
                });
                
                if (response.ok) {
                    const result = await response.text();
                    if (result === "deleted") {
                        showSuccessPopup();
                        // Reset form
                        document.getElementById('deleteForm').reset();
                        // Redirect after 3 seconds
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 2000);
                    } else {
                        showErrorPopup("Student not found");
                        setTimeout(() => {
                            window.location.href = 'delete.html';
                        }, 2000);
                    }
                } else {
                    showErrorPopup("Server error occurred");
                }
            } catch (error) {
                showErrorPopup("Network error occurred");
                console.error('Error:', error);
            }
        });
        
        function showSuccessPopup() {
            const popup = document.getElementById('successPopup');
            popup.style.display = 'flex';
            
            // Auto-hide after 3 seconds
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }
        
        function showErrorPopup(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorPopup').style.display = 'flex';
        }
        
        function closePopup(popupId) {
            document.getElementById(popupId).style.display = 'none';
        }
    </script>
</body>
</html>
