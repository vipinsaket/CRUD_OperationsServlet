<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-image: url(https://cdn.pixabay.com/photo/2018/07/05/16/59/students-3518726_1280.jpg);
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
             user-select: none;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .btn-add {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        
        .btn-show {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        
        .btn-edit {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .btn i {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 300px;
            padding: 20px;
            color: #7f8c8d;
        }
        
        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to My School</h1>
            <p>Student Management System</p>
        </header>
        
        <form method="GET" action="register.html" class="button-grid">
            <!-- Add Student Button -->
            <button type="submit" class="btn btn-add" name="action" value="add">
                <i class="fas fa-user-plus"></i>
                Add Student
            </button>
            
            <!-- Show All Students Button -->
            
            <button type="submit" class="btn btn-show" name="action" value="show" formaction="FatchData">
                <i class="fas fa-users"></i>
                Show All Students
            </button>
            
            <!-- Edit Student Button -->
            <button type="submit" class="btn btn-edit" name="action" value="edit" formaction="edit.html">
                <i class="fas fa-user-edit"></i>
                Edit Student
            </button>
            
            <!-- Delete Student Button -->
            <button type="submit" class="btn btn-delete" name="action" value="delete" formaction="delete.html">
                <i class="fas fa-user-times"></i>
                Delete Student
            </button>
        </form>
        
        <footer>
            <p>© 2025 My School Management System</p>
        </footer>
    </div>
</body>
</html>
